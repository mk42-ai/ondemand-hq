[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ondemand-blender-mcp"
version = "1.5.6"
description = "MCP server bridging the OnDemand AI platform to a live Blender instance over a TCP socket."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OnDemand" }]
keywords = ["mcp", "blender", "ondemand", "model-context-protocol", "3d", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
# Zero required runtime dependencies: the server is pure standard library so that
# `uvx ondemand-blender-mcp` cold-starts fast and cannot drift on transitive deps.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "jsonschema>=4.20",
  "werkzeug>=3.0",
]

[project.scripts]
ondemand-blender-mcp = "ondemand_blender_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/mk42-ai/ondemand-hq"
Repository = "https://github.com/mk42-ai/ondemand-hq"
Issues = "https://github.com/mk42-ai/ondemand-hq/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ondemand_blender_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "tools.json", "addon.py", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
